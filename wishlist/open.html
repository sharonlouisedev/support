<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open in Wishlyst</title>
<meta name="description" content="Open a shared wishlist or gift profile in Wishlyst.">
<style>
  :root { color-scheme: light dark; --accent: #b44563; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: clamp(16px, 1rem + 0.2vw, 18px);
    line-height: 1.65;
    margin: 0 auto;
    max-width: 42rem;
    padding: 2.5rem 1.25rem 4rem;
    color: #241a1e;
    background: #fff9f6;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f0eef0; background: #14161b; }
    a { color: #d79ab0; }
    .note { background: #1c1f27; border-color: #2c313c; }
  }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  .button {
    display: inline-block; padding: .85rem 1.6rem; border-radius: 999px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
  }
  .note {
    margin-top: 2rem; padding: 1rem 1.15rem; border-radius: 14px;
    background: #fff; border: 1px solid #f0dfe4;
  }
  footer { margin-top: 3rem; font-size: .85rem; opacity: .7; }
</style>
</head>
<body>

<h1 id="title">Open in Wishlyst</h1>
<p id="intro">Someone shared something with you.</p>

<p id="open-wrap" style="display:none">
  <a class="button" id="open" href="#">Open in Wishlyst</a>
</p>

<div class="note">
  <p><strong>Don't have the app yet?</strong>
  <a href="./help.html">Get Wishlyst</a>, then come back to this page and tap the button.</p>
</div>

<script>
  // Посылка приходит в ЯКОРЕ адреса: #w=... (список или желание) либо #p=... (профиль).
  //
  // Именно в якоре, а не в параметре: якорь не уходит на сервер ни в запросе,
  // ни в журнале, ни в Referer. Внутри — чужие желания, телефон и адрес,
  // и им незачем появляться в чужих логах.
  //
  // Страница ничего не отправляет и ничего не хранит: она только передаёт
  // то же самое приложению.
  var raw = location.hash.replace(/^#/, '');
  var params = new URLSearchParams(raw);
  var wish = params.get('w');
  var profile = params.get('p');
  var value = wish || profile;

  if (value) {
    var link = document.getElementById('open');
    link.href = 'wishlyst://open?' + (wish ? 'w=' : 'p=') + encodeURIComponent(value);
    document.getElementById('open-wrap').style.display = '';
    document.getElementById('title').textContent = wish ? 'A wishlist for you' : 'A gift profile for you';
    document.getElementById('intro').textContent = wish
      ? 'The list travels inside this link — no account, no server. Tap to add it to your app.'
      : 'Their sizes, likes and dates travel inside this link. Tap to add the card to your app.';
  } else {
    document.getElementById('intro').textContent =
      'This link is missing its content. Ask for it again — the whole link, not a piece of it.';
  }
</script>

<footer>
  <p>Sharon Louise Palmer<br>
  <a href="mailto:sharonlouisedev@gmail.com">sharonlouisedev@gmail.com</a></p>
</footer>
</body>
</html>
